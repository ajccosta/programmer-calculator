<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Programmer Calculator</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@xterm/xterm/css/xterm.css"
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: monospace;
      }
      #terminal {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module">
      import { Terminal } from "https://unpkg.com/@xterm/xterm/lib/xterm.mjs";
      import { FitAddon } from "https://unpkg.com/@xterm/addon-fit/lib/addon-fit.mjs";
      import { openpty } from "https://unpkg.com/xterm-pty/index.mjs";
      import initEmscripten from "./pcalc.mjs";

      const xterm = new Terminal();
      const fitAddon = new FitAddon();
      xterm.loadAddon(fitAddon);
      xterm.open(document.getElementById("terminal"));
      xterm.focus();

      const { master, slave } = openpty();
      xterm.loadAddon(master);
      fitAddon.fit();
      window.addEventListener("resize", () => fitAddon.fit());

      const Module = { pty: slave };
      // Mount a persistent (IndexedDB-backed) directory before main() runs,
      // and load whatever history was saved by a previous session, so
      // pcalc's history survives closing and reopening the browser.
      Module.preRun = [
        () => {
          try {
            Module.FS.mkdir("/persist");
            Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/persist");
          } catch (err) {
            console.error("pcalc: could not mount persistent history storage", err);
            return;
          }
          Module.addRunDependency("idbfs-load");
          Module.FS.syncfs(true, (err) => {
            if (err) console.error("pcalc: failed to load saved history", err);
            Module.removeRunDependency("idbfs-load");
          });
        },
      ];

      await initEmscripten(Module);
    </script>
  </body>
</html>
